<!DOCTYPE html>

<script>
// ==============================================================================
// REDESIGNED FROM THE GROUND UP: REAL 3D SURVIVAL GAME PRESENTATION
// - Procedural Realistic 3D Terrain with Height Curves, Cliffs & Organic Coastline
// - Real Ocean Depth Gradient & Animated Foam Waves
// - Realistic 3D Foliage: Curved Palm Trees, Coastal Pines, Leafy Undergrowth
// - Realistic Apocalypse Survivor Cabins: Stilt Foundations, Timber Siding, Corrugated Roofs, Porches
// - Realistic Weathered Boardwalk Dock extending into deep water
// - True Environmental Human Scaling (Human = 1.75m reference)
// - Cinematic 3/4 Third-Person Camera with Real Depth
// ==============================================================================

const canvas = document.getElementById('webgl-canvas');
const loadingScreen = document.getElementById('loading-screen');
const contextPrompt = document.getElementById('context-prompt');
const promptLabel = document.getElementById('prompt-label');

let renderer, scene, camera;
let clock = new THREE.Clock();

// Character State
let playerGroup = new THREE.Group();
let characterModel = null;
let mixer = null;
let actions = {};
let currentAction = null;
let currentActionKey = 'idle';

let playerPos = new THREE.Vector3(0, 1.8, -4); // Starts on main village path
let playerFacing = -Math.PI / 2;
let isAttacking = false;
let attackTimer = 0;
let attackDuration = 0.45;

// Camera System (Cinematic Third-Person 3/4)
let camPitch = 38 * Math.PI / 180;
let camYaw = 16 * Math.PI / 180;
let camDist = 13.5;
let targetCamDist = 13.5;
let cameraTarget = new THREE.Vector3(0, 1.8, -4);
let isCinematicView = false;

// Procedural World Elements
let terrainMesh = null;
let terrainGeo = null;
let oceanMesh = null;
let waterTime = 0;
let boatGroup = null;
let boatBobTime = 0;

// Interactive zones
const interactables = [];

// ==============================================================================
// TEXTURE GENERATION FOR REALISTIC MATERIAL RESPONSE
// ==============================================================================
function createProceduralTexture(type) {
  const c = document.createElement('canvas');
  c.width = 512;
  c.height = 512;
  const ctx = c.getContext('2d');

  if (type === 'sand') {
    // Warm natural coastal sand with fine pebble grain
    ctx.fillStyle = '#bfa77b';
    ctx.fillRect(0, 0, 512, 512);
    for (let i = 0; i < 18000; i++) {
      const x = Math.random() * 512;
      const y = Math.random() * 512;
      const gray = Math.floor(160 + Math.random() * 60);
      ctx.fillStyle = `rgba(${gray}, ${gray - 20}, ${gray - 45}, 0.18)`;
      ctx.fillRect(x, y, 1.5, 1.5);
    }
  } else if (type === 'dirt_grass') {
    // Rich coastal loam with moss & dead pine needles
    ctx.fillStyle = '#423628';
    ctx.fillRect(0, 0, 512, 512);
    for (let i = 0; i < 22000; i++) {
      const x = Math.random() * 512;
      const y = Math.random() * 512;
      const isGreen = Math.random() > 0.45;
      if (isGreen) {
        ctx.fillStyle = `rgba(${30 + Math.random()*25}, ${60 + Math.random()*35}, ${25 + Math.random()*20}, 0.28)`;
        ctx.fillRect(x, y, 3, 2);
      } else {
        ctx.fillStyle = `rgba(${75 + Math.random()*30}, ${50 + Math.random()*25}, ${30 + Math.random()*15}, 0.25)`;
        ctx.fillRect(x, y, 2, 2);
      }
    }
  } else if (type === 'wood_plank') {
    // Weathered maritime timber with visible grain and nail holes
    ctx.fillStyle = '#4e3b2b';
    ctx.fillRect(0, 0, 512, 512);
    // Draw horizontal planks
    const plankH = 64;
    for (let y = 0; y < 512; y += plankH) {
      ctx.fillStyle = 'rgba(20, 12, 8, 0.45)';
      ctx.fillRect(0, y, 512, 3); // gap line
      // Wood grain lines
      for (let j = 0; j < 30; j++) {
        const gy = y + Math.random() * plankH;
        ctx.fillStyle = `rgba(${65 + Math.random()*30}, ${48 + Math.random()*25}, ${32 + Math.random()*20}, 0.35)`;
        ctx.fillRect(0, gy, 512, 1.5);
      }
      // Weathered nails
      ctx.fillStyle = '#1c1510';
      ctx.fillRect(24, y + 28, 4, 4);
      ctx.fillRect(488, y + 28, 4, 4);
    }
  } else if (type === 'cliff_rock') {
    // Weathered coastal granite with dark fissures
    ctx.fillStyle = '#525459';
    ctx.fillRect(0, 0, 512, 512);
    for (let i = 0; i < 15000; i++) {
      const x = Math.random() * 512;
      const y = Math.random() * 512;
      const shade = Math.floor(60 + Math.random() * 45);
      ctx.fillStyle = `rgba(${shade}, ${shade + 4}, ${shade + 6}, 0.22)`;
      ctx.fillRect(x, y, 4, 2);
    }
  } else if (type === 'rusty_roof') {
    // Corrugated iron sheet with red-brown rust patches
    ctx.fillStyle = '#6e7075';
    ctx.fillRect(0, 0, 512, 512);
    // Corrugation ridges
    for (let x = 0; x < 512; x += 16) {
      ctx.fillStyle = 'rgba(255, 255, 255, 0.12)';
      ctx.fillRect(x, 0, 8, 512);
      ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
      ctx.fillRect(x + 8, 0, 8, 512);
    }
    // Rust specks
    for (let i = 0; i < 400; i++) {
      const rx = Math.random() * 512;
      const ry = Math.random() * 512;
      const s = 10 + Math.random() * 30;
      ctx.fillStyle = 'rgba(150, 60, 25, 0.35)';
      ctx.beginPath();
      ctx.arc(rx, ry, s, 0, Math.PI * 2);
      ctx.fill();
    }
  } else if (type === 'water_foam') {
    // Ocean normal/caustics pattern
    ctx.fillStyle = '#083248';
    ctx.fillRect(0, 0, 512, 512);
    for (let i = 0; i < 120; i++) {
      ctx.strokeStyle = 'rgba(180, 235, 255, 0.18)';
      ctx.lineWidth = 3 + Math.random() * 5;
      ctx.beginPath();
      ctx.arc(Math.random() * 512, Math.random() * 512, 20 + Math.random() * 60, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = THREE.RepeatWrapping;
  tex.wrapT = THREE.RepeatWrapping;
  return tex;
}

// Global PBR-stylized Materials
let texSand, texDirt, texWood, texRock, texRoof, texWater;
let matTerrain, matWaterOcean, matTimberPlanks, matCorrugatedRoof, matRockCliff;

function initMaterials() {
  texSand = createProceduralTexture('sand');
  texSand.repeat.set(12, 12);

  texDirt = createProceduralTexture('dirt_grass');
  texDirt.repeat.set(16, 16);

  texWood = createProceduralTexture('wood_plank');
  texWood.repeat.set(4, 4);

  texRock = createProceduralTexture('cliff_rock');
  texRock.repeat.set(8, 8);

  texRoof = createProceduralTexture('rusty_roof');
  texRoof.repeat.set(3, 3);

  texWater = createProceduralTexture('water_foam');
  texWater.repeat.set(6, 6);

  matTerrain = new THREE.MeshStandardMaterial({
    map: texDirt,
    roughness: 0.88,
    metalness: 0.05,
    flatShading: false,
  });

  matWaterOcean = new THREE.MeshStandardMaterial({
    color: 0x094868,
    map: texWater,
    roughness: 0.15,
    metalness: 0.35,
    transparent: true,
    opacity: 0.92,
  });

  matTimberPlanks = new THREE.MeshStandardMaterial({
    map: texWood,
    roughness: 0.82,
    metalness: 0.08,
  });

  matCorrugatedRoof = new THREE.MeshStandardMaterial({
    map: texRoof,
    roughness: 0.65,
    metalness: 0.45,
  });

  matRockCliff = new THREE.MeshStandardMaterial({
    map: texRock,
    roughness: 0.92,
    metalness: 0.05,
  });
}

// ==============================================================================
// 1. PROCEDURAL 3D NATURAL TERRAIN & COASTLINE
// ==============================================================================
function getIslandElevation(x, z) {
  // Center: (0, -6) -> Village terrace
  // South: (0, 6) -> Beach & Dock
  // North / NW: (0, -28) -> High forested hills & cliffs

  // Distance from island core
  const distCore = Math.hypot(x * 0.95, z + 8);
  if (distCore > 38) {
    return -1.5; // Deep ocean
  }

  // Base natural slope from North (+6.5m) down to South shoreline (0.0m)
  let h = 0.0;

  // South Beach Cove:
  if (z > 2) {
    // Gentle sandy beach slope down to water
    const tBeach = (z - 2) / 10.0;
    h = THREE.MathUtils.lerp(1.2, -0.4, tBeach);
  } else if (z <= 2 && z > -16) {
    // Village Terrace (Main settlement plateau)
    const tPlateau = (z - 2) / (-18);
    h = 1.2 + tPlateau * 1.6; // from 1.2m to 2.8m
  } else {
    // Back Hills & Rocky Cliffs (North)
    const tHill = (-16 - z) / 16.0;
    h = 2.8 + tHill * 4.2; // Rises up to 7.0m!
  }

  // Add natural undulating organic noise
  const noise1 = Math.sin(x * 0.14) * Math.cos(z * 0.12) * 0.75;
  const noise2 = Math.sin(x * 0.28 + 1.2) * Math.cos(z * 0.25) * 0.35;
  h += (noise1 + noise2);

  // Carve out a distinct walking path from Village down to Dock
  const pathDist = Math.abs(x - Math.sin(z * 0.2) * 1.2);
  if (pathDist < 3.0 && z > -14 && z < 7) {
    const pathSmooth = (1.0 - pathDist / 3.0);
    // Smooth walking grade
    const targetPathY = THREE.MathUtils.lerp(2.2, 0.4, (z + 14) / 21.0);
    h = THREE.MathUtils.lerp(h, targetPathY, pathSmooth * 0.65);
  }

  return h;
}

function buildNaturalTerrain() {
  const sizeX = 96;
  const sizeZ = 96;
  const segs = 80;

  terrainGeo = new THREE.PlaneGeometry(sizeX, sizeZ, segs, segs);
  terrainGeo.rotateX(-Math.PI / 2);

  const pos = terrainGeo.attributes.position;
  const colors = [];

  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i);
    const z = pos.getZ(i);
    const y = getIslandElevation(x, z);
    pos.setY(i, y);

    // Natural vertex color biome tinting:
    // Shallow water / Wet Sand: Dark sand (#6b5a3e)
    // Dry Sand: Warm yellow-tan (#cbb287)
    // Grass / Forest: Deep mossy green (#3e5634)
    // High Rock Cliffs: Slate gray (#5a5e66)
    if (y < 0.2) {
      colors.push(0.42, 0.36, 0.26); // Wet shore sand
    } else if (y < 1.1) {
      colors.push(0.78, 0.68, 0.48); // Dry sand dune
    } else if (y > 4.2) {
      colors.push(0.40, 0.42, 0.45); // Cliff stone
    } else {
      colors.push(0.28, 0.38, 0.22); // Coastal vegetation grass
    }
  }

  terrainGeo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  terrainGeo.computeVertexNormals();

  matTerrain.vertexColors = true;
  terrainMesh = new THREE.Mesh(terrainGeo, matTerrain);
  scene.add(terrainMesh);
}

// ==============================================================================
// 2. OCEAN SHADER SURFACE WITH DEPTH GRADIENT & ANIMATED FOAM
// ==============================================================================
function buildOcean() {
  const oceanGeo = new THREE.PlaneGeometry(180, 180, 40, 40);
  oceanGeo.rotateX(-Math.PI / 2);

  oceanMesh = new THREE.Mesh(oceanGeo, matWaterOcean);
  oceanMesh.position.y = 0.05;
  scene.add(oceanMesh);

  // Shoreline foam wave ring
  const foamGeo = new THREE.RingGeometry(8, 14, 32);
  foamGeo.rotateX(-Math.PI / 2);
  const matFoam = new THREE.MeshBasicMaterial({
    color: 0xdbf4ff,
    transparent: true,
    opacity: 0.45,
    depthWrite: false,
  });
  const foamMesh = new THREE.Mesh(foamGeo, matFoam);
  foamMesh.position.set(0, 0.08, 7.5);
  foamMesh.scale.set(1.5, 1, 0.8);
  scene.add(foamMesh);
}

// ==============================================================================
// 3. REALISTIC 3D VEGETATION: CURVED PALM TREES & LAYERED PINES
// ==============================================================================
function createRealisticPalmTree(x, z, scale = 1.0, rotY = 0) {
  const group = new THREE.Group();
  const yBase = getIslandElevation(x, z);
  if (yBase < 0.2) return; // Don't spawn submerged in ocean

  // Organic curved trunk (6 segments leaning toward the sun)
  const segments = 7;
  const totalHeight = 5.8 * scale;
  const curveFactor = 0.9 * scale;

  let prevPos = new THREE.Vector3(0, 0, 0);
  const trunkMat = new THREE.MeshStandardMaterial({
    color: 0x58432f,
    map: texWood,
    roughness: 0.9,
  });

  for (let i = 0; i < segments; i++) {
    const t0 = i / segments;
    const t1 = (i + 1) / segments;
    const r0 = THREE.MathUtils.lerp(0.32, 0.18, t0) * scale;
    const r1 = THREE.MathUtils.lerp(0.32, 0.18, t1) * scale;
    const h = (totalHeight / segments);

    const segGeo = new THREE.CylinderGeometry(r1, r0, h, 7);
    const segMesh = new THREE.Mesh(segGeo, trunkMat);

    const currX = Math.sin(t1 * 1.4) * curveFactor;
    const currY = t1 * totalHeight;
    const currZ = Math.cos(t1 * 1.4) * (curveFactor * 0.4);

    segMesh.position.set((prevPos.x + currX) / 2, (prevPos.y + currY) / 2, (prevPos.z + currZ) / 2);
    // Align angle
    segMesh.rotation.z = -(currX - prevPos.x) / h * 0.9;
    group.add(segMesh);

    prevPos.set(currX, currY, currZ);
  }

  // Crown of 7 drooping palm fronds
  const frondMat = new THREE.MeshStandardMaterial({
    color: 0x225528,
    roughness: 0.75,
    side: THREE.DoubleSide,
  });

  const numFronds = 8;
  for (let f = 0; f < numFronds; f++) {
    const angle = (f / numFronds) * Math.PI * 2;
    const frondGroup = new THREE.Group();
    frondGroup.position.copy(prevPos);

    // Arched frond stem with leaflets
    const frondLen = 2.8 * scale;
    const bladeGeo = new THREE.ConeGeometry(0.55 * scale, frondLen, 5);
    bladeGeo.rotateX(Math.PI / 2);
    bladeGeo.scale(1, 0.12, 1);
    const blade = new THREE.Mesh(bladeGeo, frondMat);
    blade.position.z = frondLen * 0.45;

    frondGroup.rotation.y = angle;
    frondGroup.rotation.x = 0.45; // Droop down
    frondGroup.add(blade);
    group.add(frondGroup);
  }

  // Base root flair
  const rootGeo = new THREE.CylinderGeometry(0.42 * scale, 0.55 * scale, 0.5 * scale, 8);
  const roots = new THREE.Mesh(rootGeo, trunkMat);
  roots.position.y = 0.25 * scale;
  group.add(roots);

  group.position.set(x, yBase, z);
  group.rotation.y = rotY;
  scene.add(group);
}

function createRealisticPineTree(x, z, scale = 1.0, rotY = 0) {
  const group = new THREE.Group();
  const yBase = getIslandElevation(x, z);
  if (yBase < 0.3) return;

  const trunkH = 8.5 * scale;
  const trunkGeo = new THREE.CylinderGeometry(0.18 * scale, 0.38 * scale, trunkH, 7);
  const trunkMat = new THREE.MeshStandardMaterial({ color: 0x3d2d22, map: texWood, roughness: 0.95 });
  const trunk = new THREE.Mesh(trunkGeo, trunkMat);
  trunk.position.y = trunkH * 0.5;
  group.add(trunk);

  // 4 tiered drooping needle foliage boughs
  const foliageMat = new THREE.MeshStandardMaterial({
    color: 0x1b3c22,
    roughness: 0.88,
    flatShading: true,
  });

  const tiers = 4;
  for (let t = 0; t < tiers; t++) {
    const tierR = THREE.MathUtils.lerp(2.2, 0.8, t / tiers) * scale;
    const tierH = 2.4 * scale;
    const boughGeo = new THREE.ConeGeometry(tierR, tierH, 7);
    const bough = new THREE.Mesh(boughGeo, foliageMat);
    bough.position.y = (3.5 + t * 1.5) * scale;
    group.add(bough);
  }

  group.position.set(x, yBase, z);
  group.rotation.y = rotY;
  scene.add(group);
}

function createBush(x, z, scale = 1.0) {
  const yBase = getIslandElevation(x, z);
  if (yBase < 0.3) return;
  const group = new THREE.Group();

  const bushMat = new THREE.MeshStandardMaterial({
    color: 0x2e5229,
    roughness: 0.85,
    flatShading: true,
  });

  const count = 3;
  for (let i = 0; i < count; i++) {
    const sGeo = new THREE.DodecahedronGeometry(0.65 * scale, 1);
    const sMesh = new THREE.Mesh(sGeo, bushMat);
    sMesh.position.set(
      (Math.random() - 0.5) * 0.5 * scale,
      (0.35 + Math.random() * 0.3) * scale,
      (Math.random() - 0.5) * 0.5 * scale
    );
    group.add(sMesh);
  }

  group.position.set(x, yBase, z);
  scene.add(group);
}

function createCoastalRock(x, z, scale = 1.0, rot = 0) {
  const yBase = getIslandElevation(x, z);
  const rockGeo = new THREE.DodecahedronGeometry(1.4 * scale, 1);
  // Deform for natural ruggedness
  const pos = rockGeo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    pos.setX(i, pos.getX(i) * (0.8 + Math.sin(i) * 0.25));
    pos.setY(i, pos.getY(i) * (0.55 + Math.cos(i) * 0.15));
    pos.setZ(i, pos.getZ(i) * (0.85 + Math.sin(i * 1.5) * 0.2));
  }
  rockGeo.computeVertexNormals();

  const rockMesh = new THREE.Mesh(rockGeo, matRockCliff);
  rockMesh.position.set(x, yBase + 0.3 * scale, z);
  rockMesh.rotation.set(0.2, rot, -0.15);
  scene.add(rockMesh);
}

  // Front Wall with Doorway cutout

  // A-Frame Gabled Roof with Corrugated Iron Panels & Tarpaulin Patch
  const roofW = floorW + 0.6;

  roofSlopeL.position.set(0, stiltH + wallH + 0.8, -1.0);

// 5. WEATHERED BOARDWALK DOCK (EMERGES FROM BEACH INTO OCEAN)
// ==============================================================================
function buildDetailedDock() {
  const group = new THREE.Group();

  // Dock starts from beach sand at z = 2.0 and extends into deep ocean at z = 11.0
  const startZ = 2.0;
  const endZ = 11.2;
  const dockW = 3.0; // 3m wide (~1.7x human height)
  const dockY = 0.55; // slightly above water level (0.05m)

  // 1. Heavy Wooden Pilings driven into seabed (Pairs every 2.2m)
  const pilingMat = matTimberPlanks;
  for (let z = startZ + 0.8; z <= endZ; z += 2.2) {
    const leftPiling = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.18, 2.4, 8), pilingMat);
    leftPiling.position.set(-dockW/2 + 0.2, dockY - 0.9, z);
    group.add(leftPiling);

    const rightPiling = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.18, 2.4, 8), pilingMat);
    rightPiling.position.set(dockW/2 - 0.2, dockY - 0.9, z);
    group.add(rightPiling);

    // Cross-beam support under planks
    const crossBeam = new THREE.Mesh(new THREE.BoxGeometry(dockW + 0.1, 0.18, 0.22), pilingMat);
    crossBeam.position.set(0, dockY - 0.12, z);
    group.add(crossBeam);
  }

  // 2. Individual Weathered Wooden Planks (36 planks with micro height/angle jitter)
  const numPlanks = 36;
  const plankSpacing = (endZ - startZ) / numPlanks;
  for (let i = 0; i < numPlanks; i++) {
    const pZ = startZ + i * plankSpacing;
    const pLen = dockW + (Math.sin(i * 3) * 0.12);
    const plank = new THREE.Mesh(new THREE.BoxGeometry(pLen, 0.08, plankSpacing * 0.88), matTimberPlanks);
    // Slight authentic irregularity
    plank.position.set(0, dockY + (Math.sin(i * 5) * 0.015), pZ);
    plank.rotation.y = (Math.sin(i * 7) * 0.02);
    group.add(plank);
  }

  // 3. Mooring Cleats & Coiled Ropes
  const cleatMat = new THREE.MeshStandardMaterial({ color: 0x1f2937, metalness: 0.7, roughness: 0.4 });
  function addCleat(side, pz) {
    const cleat = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.25, 6), cleatMat);
    cleat.position.set(side * (dockW/2 - 0.15), dockY + 0.12, pz);
    group.add(cleat);

    const ropeTorus = new THREE.Mesh(new THREE.TorusGeometry(0.12, 0.035, 6, 12), new THREE.MeshLambertMaterial({ color: 0xc4a46a }));
    ropeTorus.rotation.x = Math.PI / 2;
    ropeTorus.position.set(side * (dockW/2 - 0.15), dockY + 0.04, pz);
    group.add(ropeTorus);
  }
  addCleat(1, 4.5);
  addCleat(1, 8.5);
  addCleat(-1, 6.5);
  addCleat(-1, 10.5);

  // 4. Sturdy Dock Lamp Post
  const lampPost = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.1, 2.6, 6), matTimberPlanks);
  lampPost.position.set(dockW/2 - 0.2, dockY + 1.3, 7.5);
  group.add(lampPost);

  const dockBulb = new THREE.Mesh(new THREE.SphereGeometry(0.14, 8, 8), new THREE.MeshBasicMaterial({ color: 0xffcc66 }));
  dockBulb.position.set(dockW/2 - 0.2, dockY + 2.5, 7.5);
  group.add(dockBulb);

  const dockLight = new THREE.PointLight(0xffaa33, 2.2, 11.0, 1.5);
  dockLight.position.copy(dockBulb.position);
  group.add(dockLight);

  scene.add(group);
}

// ==============================================================================
// 9. LOCKED 3D CHARACTER INTEGRATION & CONTACT SHADOW
// ==============================================================================
function loadPlayerCharacter() {
  const loader = new THREE.GLTFLoader();
  loader.load('character_glb_idle_box_03_run_walk_7.glb', (gltf) => {
    characterModel = gltf.scene;

    // Strict lock: no geometry or proportion changes
    characterModel.traverse((child) => {
      if (child.isMesh && child.material) {
        child.material.metalness = 0.05;
        child.material.roughness = 0.85;
      }
    });

    // Reference scale: human ~ 1.75m tall
    characterModel.scale.set(0.95, 0.95, 0.95);
    playerGroup.add(characterModel);

    // Realistic Contact Shadow beneath boots
    const shadowGeo = new THREE.PlaneGeometry(0.85, 0.85);
    const shadowMat = new THREE.MeshBasicMaterial({
      color: 0x050c14,
      transparent: true,
      opacity: 0.55,
      depthWrite: false,
    });
    const contactShadow = new THREE.Mesh(shadowGeo, shadowMat);
    contactShadow.rotation.x = -Math.PI / 2;
    contactShadow.position.y = 0.02;
    playerGroup.add(contactShadow);

    // Animations setup
    mixer = new THREE.AnimationMixer(characterModel);
    gltf.animations.forEach((clip) => {
      const name = clip.name.toLowerCase();
      const action = mixer.clipAction(clip);
      if (name.includes('idle')) actions.idle = action;
      else if (name.includes('walk')) actions.walk = action;
      else if (name.includes('run')) actions.run = action;
      else if (name.includes('box_03') || name.includes('attack')) actions.attack = action;
    });

    if (!actions.idle && gltf.animations[0]) actions.idle = mixer.clipAction(gltf.animations[0]);
    if (!actions.attack && actions.idle) actions.attack = actions.idle;
    if (!actions.walk && actions.idle) actions.walk = actions.idle;
    if (!actions.run && actions.walk) actions.run = actions.walk;

    if (actions.idle) {
      actions.idle.play();
      currentAction = actions.idle;
      currentActionKey = 'idle';
    }

    playerGroup.position.copy(playerPos);
    scene.add(playerGroup);

    loadingScreen.classList.add('done');
  }, undefined, (err) => {
    console.error("Gagal memuat GLB:", err);
    loadingScreen.classList.add('done');
  });
}

function switchAnimation(newKey, fadeDuration = 0.14) {
  if (currentActionKey === newKey || !actions[newKey]) return;
  const prevAction = currentAction;
  const nextAction = actions[newKey];

  if (prevAction) {
    prevAction.fadeOut(fadeDuration);
  }
  nextAction.reset().fadeIn(fadeDuration).play();
  currentAction = nextAction;
  currentActionKey = newKey;
}

function triggerAttack() {
  if (isAttacking || !actions.attack) return;
  isAttacking = true;
  attackTimer = attackDuration;

  const prevAction = currentAction;
  actions.attack.reset();
  actions.attack.setLoop(THREE.LoopOnce, 1);
  actions.attack.clampWhenFinished = true;
  actions.attack.fadeIn(0.06).play();
  if (prevAction) prevAction.fadeOut(0.06);

  targetCamDist = 11.5; // Cinematic punch zoom
}

// ==============================================================================
// 10. CINEMATIC CAMERA SYSTEM
// ==============================================================================
function updateCameraTransform(targetPos, delta) {
  cameraTarget.lerp(targetPos, delta ? 6.0 * delta : 1.0);
  camDist = THREE.MathUtils.lerp(camDist, targetCamDist, delta ? 8.0 * delta : 1.0);

  const pitch = isCinematicView ? (26 * Math.PI / 180) : camPitch; // Lower angle for cinematic horizon
  const dist = isCinematicView ? 16.0 : camDist;

  const offset = new THREE.Vector3(
    Math.sin(camYaw) * Math.cos(pitch) * dist,
    Math.sin(pitch) * dist,
    Math.cos(camYaw) * Math.cos(pitch) * dist
  );
  camera.position.copy(cameraTarget).add(offset);
  camera.lookAt(cameraTarget.x, cameraTarget.y + 0.9, cameraTarget.z);
}

document.getElementById('btn-cam-toggle').addEventListener('click', () => {
  isCinematicView = !isCinematicView;
  document.getElementById('btn-cam-toggle').textContent = isCinematicView ? "Kamera: Low Horizon 26°" : "Kamera: Cinematic 3/4 (38°)";
});

// ==============================================================================
// 11. INPUT & GAME LOOP
// ==============================================================================
const keys = {};
window.addEventListener('keydown', (e) => {
  keys[e.code] = true;
  if (e.code === 'Space') {
    triggerAttack();
  }
  if (e.code === 'KeyE') {
    if (activeInteractable && activeInteractable.action) {
      activeInteractable.action();
    }
  }
});
window.addEventListener('keyup', (e) => {
  keys[e.code] = false;
});

let activeInteractable = null;

function animate() {
  requestAnimationFrame(animate);

  const delta = Math.min(clock.getDelta(), 0.05);

  // Ocean wave surface animation
  waterTime += delta * 1.2;
  if (matWaterOcean.map) {
    matWaterOcean.map.offset.y = waterTime * 0.02;
    matWaterOcean.map.offset.x = Math.sin(waterTime * 0.5) * 0.01;
  }

  // Moored boat gentle wave bobbing
  if (boatGroup) {
    boatBobTime += delta * 1.5;
    boatGroup.position.y = Math.sin(boatBobTime) * 0.06;
    boatGroup.rotation.z = Math.sin(boatBobTime * 0.7) * 0.025;
    boatGroup.rotation.x = Math.cos(boatBobTime * 0.6) * 0.015;
  }

  // Attack timer handling
  if (isAttacking) {
    attackTimer -= delta;
    if (attackTimer <= 0) {
      isAttacking = false;
      targetCamDist = 13.5;
      if (actions.attack) actions.attack.fadeOut(0.12);
      if (actions[currentActionKey]) {
        actions[currentActionKey].reset().fadeIn(0.12).play();
        currentAction = actions[currentActionKey];
      }
    }
  }

  // Movement input
  let moveX = 0;
  let moveZ = 0;
  if (keys['KeyW'] || keys['ArrowUp']) moveZ -= 1;
  if (keys['KeyS'] || keys['ArrowDown']) moveZ += 1;
  if (keys['KeyA'] || keys['ArrowLeft']) moveX -= 1;
  if (keys['KeyD'] || keys['ArrowRight']) moveX += 1;

  const isMoving = (moveX !== 0 || moveZ !== 0) && !isAttacking;
  const isSprinting = keys['ShiftLeft'] || keys['ShiftRight'];

  if (isMoving) {
    const inputDir = new THREE.Vector2(moveX, moveZ).normalize();
    const angle = camYaw;
    const rotatedX = inputDir.x * Math.cos(angle) - inputDir.y * Math.sin(angle);
    const rotatedZ = inputDir.x * Math.sin(angle) + inputDir.y * Math.cos(angle);

    const speed = isSprinting ? 5.8 : 3.2;
    playerPos.x += rotatedX * speed * delta;
    playerPos.z += rotatedZ * speed * delta;

    // Constrain within island boundaries
    playerPos.x = THREE.MathUtils.clamp(playerPos.x, -24, 24);
    playerPos.z = THREE.MathUtils.clamp(playerPos.z, -32, 11);

    // Dynamic terrain height resolution
    // If on wooden dock (z > 2.0 and |x| < 1.5), maintain dock boardwalk height (0.55m)
    if (playerPos.z >= 2.0 && Math.abs(playerPos.x) <= 1.5) {
      playerPos.y = 0.55;
    } else {
      playerPos.y = getIslandElevation(playerPos.x, playerPos.z);
    }

    const targetAngle = Math.atan2(rotatedX, rotatedZ);
    let diff = targetAngle - playerFacing;
    while (diff > Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    playerFacing += diff * 12.0 * delta;

    if (!isAttacking) {
      switchAnimation(isSprinting ? 'run' : 'walk');
    }
  } else {
    if (playerPos.z >= 2.0 && Math.abs(playerPos.x) <= 1.5) {
      playerPos.y = 0.55;
    } else {
      playerPos.y = getIslandElevation(playerPos.x, playerPos.z);
    }

    if (!isAttacking) {
      switchAnimation('idle');
    }
  }

  playerGroup.position.copy(playerPos);
  if (characterModel) {
    characterModel.rotation.y = playerFacing;
  }

  // Check interactables
  activeInteractable = null;
  for (let obj of interactables) {
    if (playerPos.distanceTo(obj.pos) < obj.radius) {
      activeInteractable = obj;
      break;
    }
  }

  if (activeInteractable) {
    promptLabel.textContent = activeInteractable.label;
    contextPrompt.classList.add('show');
  } else {
    contextPrompt.classList.remove('show');
  }

  updateCameraTransform(playerPos, delta);

  if (mixer) {
    mixer.update(delta);
  }

  renderer.render(scene, camera);
}

// Initialization
window.addEventListener('DOMContentLoaded', () => {
  renderer = new THREE.WebGLRenderer({
    canvas,
    antialias: false,
    powerPreference: 'high-performance',
    precision: 'mediump'
  });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.25));

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0c1e30);
  scene.fog = new THREE.FogExp2(0x0e2438, 0.014);

  camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.5, 160);

  // Warm Cinematic Sunlight with atmospheric blue sky ambient
  const hemi = new THREE.HemisphereLight(0xaad3f5, 0x1a2e38, 0.85);
  scene.add(hemi);

  const sun = new THREE.DirectionalLight(0xffecd0, 1.35);
  sun.position.set(22, 38, 16);
  scene.add(sun);

  // Soft horizon rim light
  const rim = new THREE.DirectionalLight(0xd97736, 0.45);
  rim.position.set(-20, 12, -25);
  scene.add(rim);

  initMaterials();
  populateSafeIslandScene();
  loadPlayerCharacter();

  window.addEventListener('resize', onResize);
  animate();
});
</script>
</body>
</html>
