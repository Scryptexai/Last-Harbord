<script>
// ==============================================================================
// REALISTIC / STYLIZED-REALISTIC 3D SURVIVAL WORLD
// Bright Daylight Coastal Environment:
// 1. Procedural Natural 3D Terrain with elevation contours, beach, village terrace, and cliffs
// 2. Beautiful Turquoise Ocean with depth gradient and shoreline foam
// 3. Authentic Survivor Cabins on stilts with corrugated tin roofs, porches, crates, and drums
// 4. Organic Foliage: Curved coastal palms with fanning fronds, towering pines, bushes, and rocks
// 5. Weathered Boardwalk Dock with round pilings and cleats extending into water
// 6. Moored Expedition Boat with curved hull and cargo
// 7. Locked 3D Player Character with Human Scale Reference (~1.75m) & Contact Shadow
// 8. Cinematic 3/4 Third-Person Perspective (38° angle with Low Horizon toggle)
// ==============================================================================

const canvas = document.getElementById('webgl-canvas');
const contextPrompt = document.getElementById('context-prompt');
const promptLabel = document.getElementById('prompt-label');

let renderer, scene, camera;
let clock = new THREE.Clock();

// Character State
let playerGroup = new THREE.Group();
let characterModel = null;
let placeholderModel = null;
let mixer = null;
let actions = {};
let currentAction = null;
let currentActionKey = 'idle';

let playerPos = new THREE.Vector3(0, 1.8, -4);
let playerFacing = -Math.PI / 2;
let isAttacking = false;
let attackTimer = 0;
let attackDuration = 0.45;

// Camera System (Cinematic Third-Person 3/4)
let camPitch = 38 * Math.PI / 180;
let camYaw = 16 * Math.PI / 180;
let camDist = 13.5;
let targetCamDist = 13.5;
let cameraTarget = new THREE.Vector3(0, 1.8, -4);
let isCinematicView = false;

// World Elements
let terrainMesh = null;
let terrainGeo = null;
let oceanMesh = null;
let waterTime = 0;
let boatGroup = null;
let boatBobTime = 0;

// Interactive elements
const interactables = [];
let activeInteractable = null;

// Materials
let matTerrain, matWaterOcean, matTimberPlanks, matCorrugatedRoof, matRockCliff, matPalmFrond, matPineNeedles;

function initMaterials() {
  const cSand = document.createElement('canvas'); cSand.width = cSand.height = 256;
  const ctxS = cSand.getContext('2d');
  ctxS.fillStyle = '#dfc28d'; ctxS.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 4000; i++) {
    ctxS.fillStyle = Math.random() > 0.5 ? 'rgba(180, 150, 100, 0.3)' : 'rgba(240, 220, 175, 0.4)';
    ctxS.fillRect(Math.random()*256, Math.random()*256, 2, 2);
  }
  const texSand = new THREE.CanvasTexture(cSand);
  texSand.wrapS = texSand.wrapT = THREE.RepeatWrapping;
  texSand.repeat.set(12, 12);

  const cWood = document.createElement('canvas'); cWood.width = cWood.height = 256;
  const ctxW = cWood.getContext('2d');
  ctxW.fillStyle = '#6d482f'; ctxW.fillRect(0, 0, 256, 256);
  for (let y = 0; y < 256; y += 32) {
    ctxW.fillStyle = 'rgba(25, 14, 8, 0.45)'; ctxW.fillRect(0, y, 256, 2);
    for (let j = 0; j < 12; j++) {
      ctxW.fillStyle = 'rgba(95, 65, 40, 0.35)'; ctxW.fillRect(0, y + Math.random()*32, 256, 1.5);
    }
  }
  const texWood = new THREE.CanvasTexture(cWood);
  texWood.wrapS = texWood.wrapT = THREE.RepeatWrapping;
  texWood.repeat.set(4, 4);

  const cRoof = document.createElement('canvas'); cRoof.width = cRoof.height = 256;
  const ctxR = cRoof.getContext('2d');
  ctxR.fillStyle = '#7a7e85'; ctxR.fillRect(0, 0, 256, 256);
  for (let x = 0; x < 256; x += 16) {
    ctxR.fillStyle = 'rgba(255, 255, 255, 0.18)'; ctxR.fillRect(x, 0, 8, 256);
    ctxR.fillStyle = 'rgba(0, 0, 0, 0.22)'; ctxR.fillRect(x + 8, 0, 8, 256);
  }
  for (let i = 0; i < 150; i++) {
    ctxR.fillStyle = 'rgba(175, 75, 30, 0.4)';
    ctxR.beginPath(); ctxR.arc(Math.random()*256, Math.random()*256, 8 + Math.random()*15, 0, Math.PI*2); ctxR.fill();
  }
  const texRoof = new THREE.CanvasTexture(cRoof);
  texRoof.wrapS = texRoof.wrapT = THREE.RepeatWrapping;
  texRoof.repeat.set(3, 3);

  matTerrain = new THREE.MeshLambertMaterial({
    map: texSand,
    flatShading: false,
    vertexColors: true,
  });

  matWaterOcean = new THREE.MeshLambertMaterial({
    color: 0x0284c7,
    transparent: true,
    opacity: 0.88,
  });

  matTimberPlanks = new THREE.MeshLambertMaterial({
    map: texWood,
    color: 0xffffff,
  });

  matCorrugatedRoof = new THREE.MeshLambertMaterial({
    map: texRoof,
    color: 0xffffff,
  });

  matRockCliff = new THREE.MeshLambertMaterial({
    color: 0x6e727a,
  });

  matPalmFrond = new THREE.MeshLambertMaterial({
    color: 0x2d6a4f,
    side: THREE.DoubleSide,
  });

  matPineNeedles = new THREE.MeshLambertMaterial({
    color: 0x1b4332,
    flatShading: true,
  });
}

// ==============================================================================
// 1. NATURAL 3D TERRAIN & COASTLINE
// ==============================================================================
function getIslandElevation(x, z) {
  const distCore = Math.hypot(x * 0.95, z + 8);
  if (distCore > 38) return -1.5;

  let h = 0.0;
  if (z > 2) {
    const tBeach = (z - 2) / 10.0;
    h = THREE.MathUtils.lerp(1.2, -0.4, tBeach);
  } else if (z <= 2 && z > -16) {
    const tPlateau = (z - 2) / (-18);
    h = 1.2 + tPlateau * 1.6;
  } else {
    const tHill = (-16 - z) / 16.0;
    h = 2.8 + tHill * 4.2;
  }

  const noise = Math.sin(x * 0.14) * Math.cos(z * 0.12) * 0.75 + Math.sin(x * 0.28 + 1.2) * Math.cos(z * 0.25) * 0.35;
  h += noise;

  const pathDist = Math.abs(x - Math.sin(z * 0.2) * 1.2);
  if (pathDist < 3.0 && z > -14 && z < 7) {
    const pathSmooth = (1.0 - pathDist / 3.0);
    const targetPathY = THREE.MathUtils.lerp(2.2, 0.4, (z + 14) / 21.0);
    h = THREE.MathUtils.lerp(h, targetPathY, pathSmooth * 0.65);
  }

  return h;
}

function buildNaturalTerrain() {
  const sizeX = 96;
  const sizeZ = 96;
  const segs = 80;

  terrainGeo = new THREE.PlaneGeometry(sizeX, sizeZ, segs, segs);
  terrainGeo.rotateX(-Math.PI / 2);

  const pos = terrainGeo.attributes.position;
  const colors = [];

  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i);
    const z = pos.getZ(i);
    const y = getIslandElevation(x, z);
    pos.setY(i, y);

    if (y < 0.2) {
      colors.push(0.72, 0.62, 0.48);
    } else if (y < 1.1) {
      colors.push(0.95, 0.88, 0.68);
    } else if (y > 4.2) {
      colors.push(0.62, 0.65, 0.68);
    } else {
      const pathDist = Math.abs(x - Math.sin(z * 0.2) * 1.2);
      if (pathDist < 2.0 && z > -14 && z < 7) {
        colors.push(0.78, 0.64, 0.48);
      } else {
        colors.push(0.42, 0.65, 0.32);
      }
    }
  }

  terrainGeo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  terrainGeo.computeVertexNormals();

  terrainMesh = new THREE.Mesh(terrainGeo, matTerrain);
  scene.add(terrainMesh);
}

// ==============================================================================
// 2. OCEAN DEPTH & SHORELINE FOAM
// ==============================================================================
function buildOcean() {
  const oceanGeo = new THREE.PlaneGeometry(200, 200, 32, 32);
  oceanGeo.rotateX(-Math.PI / 2);

  oceanMesh = new THREE.Mesh(oceanGeo, matWaterOcean);
  oceanMesh.position.y = 0.05;
  scene.add(oceanMesh);

  const foamGeo = new THREE.RingGeometry(8, 14, 32);
  foamGeo.rotateX(-Math.PI / 2);
  const matFoam = new THREE.MeshBasicMaterial({
    color: 0xffffff,
    transparent: true,
    opacity: 0.6,
    depthWrite: false,
  });
  const foamMesh = new THREE.Mesh(foamGeo, matFoam);
  foamMesh.position.set(0, 0.08, 7.5);
  foamMesh.scale.set(1.5, 1, 0.8);
  scene.add(foamMesh);
}

// ==============================================================================
// 3. REALISTIC 3D VEGETATION
// ==============================================================================
function createRealisticPalmTree(x, z, scale = 1.0, rotY = 0) {
  const yBase = getIslandElevation(x, z);
  if (yBase < 0.2) return;
  const group = new THREE.Group();

  const segments = 7;
  const totalHeight = 6.0 * scale;
  const curveFactor = 0.95 * scale;
  let prevPos = new THREE.Vector3(0, 0, 0);

  for (let i = 0; i < segments; i++) {
    const t0 = i / segments;
    const t1 = (i + 1) / segments;
    const r0 = THREE.MathUtils.lerp(0.32, 0.18, t0) * scale;
    const r1 = THREE.MathUtils.lerp(0.32, 0.18, t1) * scale;
    const h = totalHeight / segments;

    const segGeo = new THREE.CylinderGeometry(r1, r0, h, 7);
    const segMesh = new THREE.Mesh(segGeo, matTimberPlanks);

    const currX = Math.sin(t1 * 1.4) * curveFactor;
    const currY = t1 * totalHeight;
    const currZ = Math.cos(t1 * 1.4) * (curveFactor * 0.4);

    segMesh.position.set((prevPos.x + currX) / 2, (prevPos.y + currY) / 2, (prevPos.z + currZ) / 2);
    segMesh.rotation.z = -(currX - prevPos.x) / h * 0.9;
    group.add(segMesh);

    prevPos.set(currX, currY, currZ);
  }

  const numFronds = 8;
  for (let f = 0; f < numFronds; f++) {
    const angle = (f / numFronds) * Math.PI * 2;
    const frondGroup = new THREE.Group();
    frondGroup.position.copy(prevPos);

    const frondLen = 2.8 * scale;
    const bladeGeo = new THREE.ConeGeometry(0.55 * scale, frondLen, 5);
    bladeGeo.rotateX(Math.PI / 2);
    bladeGeo.scale(1, 0.12, 1);
    const blade = new THREE.Mesh(bladeGeo, matPalmFrond);
    blade.position.z = frondLen * 0.45;

    frondGroup.rotation.y = angle;
    frondGroup.rotation.x = 0.45;
    frondGroup.add(blade);
    group.add(frondGroup);
  }

  group.position.set(x, yBase, z);
  group.rotation.y = rotY;
  scene.add(group);
}

function createRealisticPineTree(x, z, scale = 1.0, rotY = 0) {
  const yBase = getIslandElevation(x, z);
  if (yBase < 0.3) return;
  const group = new THREE.Group();

  const trunkH = 8.5 * scale;
  const trunkGeo = new THREE.CylinderGeometry(0.18 * scale, 0.38 * scale, trunkH, 7);
  const trunk = new THREE.Mesh(trunkGeo, matTimberPlanks);
  trunk.position.y = trunkH * 0.5;
  group.add(trunk);

  const tiers = 4;
  for (let t = 0; t < tiers; t++) {
    const tierR = THREE.MathUtils.lerp(2.2, 0.8, t / tiers) * scale;
    const tierH = 2.4 * scale;
    const boughGeo = new THREE.ConeGeometry(tierR, tierH, 7);
    const bough = new THREE.Mesh(boughGeo, matPineNeedles);
    bough.position.y = (3.5 + t * 1.5) * scale;
    group.add(bough);
  }

  group.position.set(x, yBase, z);
  group.rotation.y = rotY;
  scene.add(group);
}

function createBush(x, z, scale = 1.0) {
  const yBase = getIslandElevation(x, z);
  if (yBase < 0.3) return;
  const group = new THREE.Group();

  for (let i = 0; i < 3; i++) {
    const sGeo = new THREE.DodecahedronGeometry(0.65 * scale, 1);
    const sMesh = new THREE.Mesh(sGeo, matPalmFrond);
    sMesh.position.set(
      (Math.random() - 0.5) * 0.5 * scale,
      (0.35 + Math.random() * 0.3) * scale,
      (Math.random() - 0.5) * 0.5 * scale
    );
    group.add(sMesh);
  }

  group.position.set(x, yBase, z);
  scene.add(group);
}

function createCoastalRock(x, z, scale = 1.0, rot = 0) {
  const yBase = getIslandElevation(x, z);
  const rockGeo = new THREE.DodecahedronGeometry(1.4 * scale, 1);
  const rockMesh = new THREE.Mesh(rockGeo, matRockCliff);
  rockMesh.position.set(x, yBase + 0.3 * scale, z);
  rockMesh.rotation.set(0.2, rot, -0.15);
  scene.add(rockMesh);
}

// ==============================================================================
// 4. REALISTIC SURVIVOR CABINS
// ==============================================================================
function createDetailedSurvivorCabin(x, z, rotY = 0) {
  const group = new THREE.Group();
  const yBase = getIslandElevation(x, z);

  const floorW = 4.8;
  const floorD = 4.2;
  const stiltH = 0.6;

  for (let sx = -floorW/2 + 0.3; sx <= floorW/2 - 0.3; sx += (floorW - 0.6)/2) {
    for (let sz = -floorD/2 + 0.3; sz <= floorD/2 - 0.3; sz += (floorD - 0.6)) {
      const stilt = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.16, stiltH + 0.4, 6), matTimberPlanks);
      stilt.position.set(sx, (stiltH + 0.4)/2 - 0.2, sz);
      group.add(stilt);
    }
  }

  const deck = new THREE.Mesh(new THREE.BoxGeometry(floorW + 0.3, 0.18, floorD + 1.2), matTimberPlanks);
  deck.position.set(0, stiltH, 0.4);
  group.add(deck);

  const step = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.25, 0.6), matTimberPlanks);
  step.position.set(0, stiltH * 0.4, floorD/2 + 0.9);
  group.add(step);

  const wallH = 2.4;
  const backWall = new THREE.Mesh(new THREE.BoxGeometry(floorW, wallH, 0.15), matTimberPlanks);
  backWall.position.set(0, stiltH + wallH/2, -floorD/2);
  group.add(backWall);

  const wallL = new THREE.Mesh(new THREE.BoxGeometry(0.15, wallH, floorD), matTimberPlanks);
  wallL.position.set(-floorW/2, stiltH + wallH/2, 0);
  group.add(wallL);

  const wallR = new THREE.Mesh(new THREE.BoxGeometry(0.15, wallH, floorD), matTimberPlanks);
  wallR.position.set(floorW/2, stiltH + wallH/2, 0);
  group.add(wallR);

  const frontWallL = new THREE.Mesh(new THREE.BoxGeometry(1.6, wallH, 0.15), matTimberPlanks);
  frontWallL.position.set(-1.45, stiltH + wallH/2, floorD/2);
  group.add(frontWallL);

  const frontWallR = new THREE.Mesh(new THREE.BoxGeometry(1.6, wallH, 0.15), matTimberPlanks);
  frontWallR.position.set(1.45, stiltH + wallH/2, floorD/2);
  group.add(frontWallR);

  const frontHeader = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.5, 0.15), matTimberPlanks);
  frontHeader.position.set(0, stiltH + wallH - 0.25, floorD/2);
  group.add(frontHeader);

  const roofW = floorW + 0.6;
  const roofSlopeL = new THREE.Mesh(new THREE.BoxGeometry(roofW, 0.08, 2.8), matCorrugatedRoof);
  roofSlopeL.position.set(0, stiltH + wallH + 0.8, -1.0);
  roofSlopeL.rotation.x = 0.55;
  group.add(roofSlopeL);

  const roofSlopeR = new THREE.Mesh(new THREE.BoxGeometry(roofW, 0.08, 2.8), matCorrugatedRoof);
  roofSlopeR.position.set(0, stiltH + wallH + 0.8, 1.0);
  roofSlopeR.rotation.x = -0.55;
  group.add(roofSlopeR);

  const matTarp = new THREE.MeshLambertMaterial({ color: 0x2563eb });
  const tarp = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.04, 1.8), matTarp);
  tarp.position.set(-0.8, stiltH + wallH + 0.86, -0.8);
  tarp.rotation.x = 0.55;
  group.add(tarp);

  const postL = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, wallH, 6), matTimberPlanks);
  postL.position.set(-floorW/2 + 0.2, stiltH + wallH/2, floorD/2 + 0.8);
  group.add(postL);

  const postR = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, wallH, 6), matTimberPlanks);
  postR.position.set(floorW/2 - 0.2, stiltH + wallH/2, floorD/2 + 0.8);
  group.add(postR);

  const crateA = new THREE.Mesh(new THREE.BoxGeometry(0.85, 0.8, 0.85), matTimberPlanks);
  crateA.position.set(floorW/2 + 0.6, stiltH + 0.4, 0.3);
  group.add(crateA);

  const matDrum = new THREE.MeshLambertMaterial({ color: 0x334155 });
  const drum = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.32, 0.95, 10), matDrum);
  drum.position.set(floorW/2 + 0.6, stiltH + 0.48, -0.7);
  group.add(drum);

  group.position.set(x, yBase, z);
  group.rotation.y = rotY;
  scene.add(group);
}

// ==============================================================================
// 5. WEATHERED BOARDWALK DOCK
// ==============================================================================
function buildDetailedDock() {
  const group = new THREE.Group();
  const startZ = 2.0;
  const endZ = 11.2;
  const dockW = 3.0;
  const dockY = 0.55;

  for (let z = startZ + 0.8; z <= endZ; z += 2.2) {
    const pL = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.18, 2.4, 8), matTimberPlanks);
    pL.position.set(-dockW/2 + 0.2, dockY - 0.9, z);
    group.add(pL);

    const pR = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.18, 2.4, 8), matTimberPlanks);
    pR.position.set(dockW/2 - 0.2, dockY - 0.9, z);
    group.add(pR);

    const beam = new THREE.Mesh(new THREE.BoxGeometry(dockW + 0.1, 0.18, 0.22), matTimberPlanks);
    beam.position.set(0, dockY - 0.12, z);
    group.add(beam);
  }

  const numPlanks = 36;
  const spacing = (endZ - startZ) / numPlanks;
  for (let i = 0; i < numPlanks; i++) {
    const pZ = startZ + i * spacing;
    const plank = new THREE.Mesh(new THREE.BoxGeometry(dockW + Math.sin(i*3)*0.1, 0.08, spacing * 0.88), matTimberPlanks);
    plank.position.set(0, dockY + Math.sin(i*5)*0.012, pZ);
    plank.rotation.y = Math.sin(i*7)*0.02;
    group.add(plank);
  }

  const matCleat = new THREE.MeshLambertMaterial({ color: 0x1e293b });
  const matRope = new THREE.MeshLambertMaterial({ color: 0xd97706 });
  function addCleat(side, pz) {
    const cleat = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.25, 6), matCleat);
    cleat.position.set(side * (dockW/2 - 0.15), dockY + 0.12, pz);
    group.add(cleat);

    const rope = new THREE.Mesh(new THREE.TorusGeometry(0.12, 0.035, 6, 10), matRope);
    rope.rotation.x = Math.PI / 2;
    rope.position.set(side * (dockW/2 - 0.15), dockY + 0.04, pz);
    group.add(rope);
  }
  addCleat(1, 4.5);
  addCleat(1, 8.5);
  addCleat(-1, 6.5);
  addCleat(-1, 10.5);

  const lampPost = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.1, 2.6, 6), matTimberPlanks);
  lampPost.position.set(dockW/2 - 0.2, dockY + 1.3, 7.5);
  group.add(lampPost);

  const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.14, 8, 8), new THREE.MeshBasicMaterial({ color: 0xffd175 }));
  bulb.position.set(dockW/2 - 0.2, dockY + 2.5, 7.5);
  group.add(bulb);

  const light = new THREE.PointLight(0xffa500, 2.0, 10.0, 1.4);
  light.position.copy(bulb.position);
  group.add(light);

  scene.add(group);
}

// ==============================================================================
// 6. MOORED EXPEDITION BOAT
// ==============================================================================
function buildDetailedBoat() {
  boatGroup = new THREE.Group();

  const hullBase = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.7, 4.4), matTimberPlanks);
  hullBase.position.y = 0.35;
  boatGroup.add(hullBase);

  const bowGeo = new THREE.ConeGeometry(0.95, 1.4, 4);
  bowGeo.rotateX(Math.PI / 2);
  bowGeo.scale(1, 0.55, 1);
  const bow = new THREE.Mesh(bowGeo, matTimberPlanks);
  bow.position.set(0, 0.42, 2.7);
  boatGroup.add(bow);

  const bench = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.08, 0.4), matTimberPlanks);
  bench.position.set(0, 0.65, 0.8);
  boatGroup.add(bench);

  boatGroup.position.set(2.8, 0.0, 8.2);
  scene.add(boatGroup);

  interactables.push({
    pos: new THREE.Vector3(1.8, 0.6, 8.2),
    radius: 2.8,
    label: "Naik Perahu & Siapkan Pelayaran",
    action: () => {
      alert("⚓ Perahu siap! Meluncurkan pelayaran.");
    }
  });
}

// ==============================================================================
// 7. SURVIVOR CAMPFIRE
// ==============================================================================
function buildCampfire(x, z) {
  const group = new THREE.Group();
  const yBase = getIslandElevation(x, z);

  const numStones = 9;
  for (let i = 0; i < numStones; i++) {
    const angle = (i / numStones) * Math.PI * 2;
    const stone = new THREE.Mesh(new THREE.DodecahedronGeometry(0.22, 1), matRockCliff);
    stone.position.set(Math.cos(angle) * 0.75, 0.12, Math.sin(angle) * 0.75);
    group.add(stone);
  }

  const matChar = new THREE.MeshLambertMaterial({ color: 0x1f1915 });
  for (let j = 0; j < 4; j++) {
    const log = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.09, 0.85, 5), matChar);
    log.rotation.z = Math.PI / 3;
    log.rotation.y = j * Math.PI / 2;
    log.position.y = 0.14;
    group.add(log);
  }

  const flame = new THREE.Mesh(new THREE.ConeGeometry(0.35, 0.65, 6), new THREE.MeshBasicMaterial({ color: 0xff6b1a }));
  flame.position.y = 0.45;
  group.add(flame);

  const fireLight = new THREE.PointLight(0xff7722, 2.6, 12.0, 1.4);
  fireLight.position.set(0, 0.8, 0);
  group.add(fireLight);

  group.position.set(x, yBase, z);
  scene.add(group);
}

// ==============================================================================
// 9. 3D CHARACTER INTEGRATION & CONTACT SHADOW
// ==============================================================================
function createPlaceholderCharacter() {
  placeholderModel = new THREE.Group();
  const matJacket = new THREE.MeshLambertMaterial({ color: 0x2b3a4a });
  const matSkin = new THREE.MeshLambertMaterial({ color: 0xd4a373 });

  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.26, 1.0, 8), matJacket);
  body.position.y = 0.9;
  placeholderModel.add(body);

  const head = new THREE.Mesh(new THREE.SphereGeometry(0.18, 8, 8), matSkin);
  head.position.y = 1.55;
  placeholderModel.add(head);

  playerGroup.add(placeholderModel);
}

function loadPlayerCharacter() {
  createPlaceholderCharacter();

  const shadowGeo = new THREE.PlaneGeometry(0.85, 0.85);
  const shadowMat = new THREE.MeshBasicMaterial({
    color: 0x050c14,
    transparent: true,
    opacity: 0.55,
    depthWrite: false,
  });
  const contactShadow = new THREE.Mesh(shadowGeo, shadowMat);
  contactShadow.rotation.x = -Math.PI / 2;
  contactShadow.position.y = 0.02;
  playerGroup.add(contactShadow);

  playerGroup.position.copy(playerPos);
  scene.add(playerGroup);

  const loader = new THREE.GLTFLoader();
  loader.load('character_glb_idle_box_03_run_walk_7.glb', (gltf) => {
    characterModel = gltf.scene;

    if (placeholderModel) {
      playerGroup.remove(placeholderModel);
      placeholderModel = null;
    }

    characterModel.traverse((child) => {
      if (child.isMesh && child.material) {
        child.material.metalness = 0.0;
        child.material.roughness = 0.85;
      }
    });

    characterModel.scale.set(0.95, 0.95, 0.95);
    playerGroup.add(characterModel);

    mixer = new THREE.AnimationMixer(characterModel);
    gltf.animations.forEach((clip) => {
      const name = clip.name.toLowerCase();
      const action = mixer.clipAction(clip);
      if (name.includes('idle')) actions.idle = action;
      else if (name.includes('walk')) actions.walk = action;
      else if (name.includes('run')) actions.run = action;
      else if (name.includes('box_03') || name.includes('attack')) actions.attack = action;
    });

    if (!actions.idle && gltf.animations[0]) actions.idle = mixer.clipAction(gltf.animations[0]);
    if (!actions.attack && actions.idle) actions.attack = actions.idle;
    if (!actions.walk && actions.idle) actions.walk = actions.idle;
    if (!actions.run && actions.walk) actions.run = actions.walk;

    if (actions.idle) {
      actions.idle.play();
      currentAction = actions.idle;
      currentActionKey = 'idle';
    }
  }, undefined, (err) => {
    console.warn("Using stylized character fallback:", err);
  });
}

function switchAnimation(newKey, fadeDuration = 0.14) {
  if (currentActionKey === newKey || !actions[newKey]) return;
  const prevAction = currentAction;
  const nextAction = actions[newKey];

  if (prevAction) {
    prevAction.fadeOut(fadeDuration);
  }
  nextAction.reset().fadeIn(fadeDuration).play();
  currentAction = nextAction;
  currentActionKey = newKey;
}

function triggerAttack() {
  if (isAttacking || !actions.attack) return;
  isAttacking = true;
  attackTimer = attackDuration;

  const prevAction = currentAction;
  actions.attack.reset();
  actions.attack.setLoop(THREE.LoopOnce, 1);
  actions.attack.clampWhenFinished = true;
  actions.attack.fadeIn(0.06).play();
  if (prevAction) prevAction.fadeOut(0.06);

  targetCamDist = 11.5;
}

// ==============================================================================
// 10. CINEMATIC CAMERA SYSTEM
// ==============================================================================
function updateCameraTransform(targetPos, delta) {
  cameraTarget.lerp(targetPos, delta ? 6.0 * delta : 1.0);
  camDist = THREE.MathUtils.lerp(camDist, targetCamDist, delta ? 8.0 * delta : 1.0);

  const pitch = isCinematicView ? (26 * Math.PI / 180) : camPitch;
  const dist = isCinematicView ? 16.0 : camDist;

  const offset = new THREE.Vector3(
    Math.sin(camYaw) * Math.cos(pitch) * dist,
    Math.sin(pitch) * dist,
    Math.cos(camYaw) * Math.cos(pitch) * dist
  );
  camera.position.copy(cameraTarget).add(offset);
  camera.lookAt(cameraTarget.x, cameraTarget.y + 0.9, cameraTarget.z);
}

document.getElementById('btn-cam-toggle').addEventListener('click', () => {
  isCinematicView = !isCinematicView;
  document.getElementById('btn-cam-toggle').textContent = isCinematicView ? "Kamera: Low Horizon 26°" : "Kamera: Cinematic 3/4 (38°)";
});

// ==============================================================================
// 11. INPUT & GAME LOOP
// ==============================================================================
const keys = {};
window.addEventListener('keydown', (e) => {
  keys[e.code] = true;
  if (e.code === 'Space') {
    triggerAttack();
  }
  if (e.code === 'KeyE') {
    if (activeInteractable && activeInteractable.action) {
      activeInteractable.action();
    }
  }
});
window.addEventListener('keyup', (e) => {
  keys[e.code] = false;
});

function animate() {
  requestAnimationFrame(animate);

  const delta = Math.min(clock.getDelta(), 0.05);

  waterTime += delta * 1.5;
  if (oceanMesh) {
    oceanMesh.position.y = 0.05 + Math.sin(waterTime) * 0.03;
  }

  if (boatGroup) {
    boatBobTime += delta * 1.5;
    boatGroup.position.y = Math.sin(boatBobTime) * 0.06;
    boatGroup.rotation.z = Math.sin(boatBobTime * 0.7) * 0.025;
    boatGroup.rotation.x = Math.cos(boatBobTime * 0.6) * 0.015;
  }

  if (isAttacking) {
    attackTimer -= delta;
    if (attackTimer <= 0) {
      isAttacking = false;
      targetCamDist = 13.5;
      if (actions.attack) actions.attack.fadeOut(0.12);
      if (actions[currentActionKey]) {
        actions[currentActionKey].reset().fadeIn(0.12).play();
        currentAction = actions[currentActionKey];
      }
    }
  }

  let moveX = 0;
  let moveZ = 0;
  if (keys['KeyW'] || keys['ArrowUp']) moveZ -= 1;
  if (keys['KeyS'] || keys['ArrowDown']) moveZ += 1;
  if (keys['KeyA'] || keys['ArrowLeft']) moveX -= 1;
  if (keys['KeyD'] || keys['ArrowRight']) moveX += 1;

  const isMoving = (moveX !== 0 || moveZ !== 0) && !isAttacking;
  const isSprinting = keys['ShiftLeft'] || keys['ShiftRight'];

  if (isMoving) {
    const inputDir = new THREE.Vector2(moveX, moveZ).normalize();
    const angle = camYaw;
    const rotatedX = inputDir.x * Math.cos(angle) - inputDir.y * Math.sin(angle);
    const rotatedZ = inputDir.x * Math.sin(angle) + inputDir.y * Math.cos(angle);

    const speed = isSprinting ? 5.8 : 3.2;
    playerPos.x += rotatedX * speed * delta;
    playerPos.z += rotatedZ * speed * delta;

    playerPos.x = THREE.MathUtils.clamp(playerPos.x, -24, 24);
    playerPos.z = THREE.MathUtils.clamp(playerPos.z, -32, 11);

    if (playerPos.z >= 2.0 && Math.abs(playerPos.x) <= 1.5) {
      playerPos.y = 0.55;
    } else {
      playerPos.y = getIslandElevation(playerPos.x, playerPos.z);
    }

    const targetAngle = Math.atan2(rotatedX, rotatedZ);
    let diff = targetAngle - playerFacing;
    while (diff > Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    playerFacing += diff * 12.0 * delta;

    if (!isAttacking) {
      switchAnimation(isSprinting ? 'run' : 'walk');
    }
  } else {
    if (playerPos.z >= 2.0 && Math.abs(playerPos.x) <= 1.5) {
      playerPos.y = 0.55;
    } else {
      playerPos.y = getIslandElevation(playerPos.x, playerPos.z);
    }

    if (!isAttacking) {
      switchAnimation('idle');
    }
  }

  playerGroup.position.copy(playerPos);
  if (characterModel) {
    characterModel.rotation.y = playerFacing;
  }
  if (placeholderModel) {
    placeholderModel.rotation.y = playerFacing;
  }

  activeInteractable = null;
  for (let obj of interactables) {
    if (playerPos.distanceTo(obj.pos) < obj.radius) {
      activeInteractable = obj;
      break;
    }
  }

  if (activeInteractable) {
    promptLabel.textContent = activeInteractable.label;
    contextPrompt.classList.add('show');
  } else {
    contextPrompt.classList.remove('show');
  }

  updateCameraTransform(playerPos, delta);

  if (mixer) {
    mixer.update(delta);
  }

  renderer.render(scene, camera);
}

// Window init
window.addEventListener('DOMContentLoaded', () => {
  renderer = new THREE.WebGLRenderer({
    canvas,
    antialias: false,
    powerPreference: 'high-performance',
    precision: 'mediump'
  });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.25));

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x8ec5fc);
  scene.fog = new THREE.FogExp2(0xa1c4fd, 0.009);

  camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.5, 160);

  const hemi = new THREE.HemisphereLight(0xbbe1fa, 0x5a4a35, 1.15);
  scene.add(hemi);

  const sun = new THREE.DirectionalLight(0xfff5e6, 1.7);
  sun.position.set(28, 45, 24);
  scene.add(sun);

  const fillSun = new THREE.DirectionalLight(0xa0d8ef, 0.65);
  fillSun.position.set(-20, 25, -20);
  scene.add(fillSun);

  initMaterials();
  populateSafeIslandScene();
  loadPlayerCharacter();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  animate();
});
