<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Last Harbor — Bertahan di Laut yang Naik</title>
<link rel="icon" type="image/png" href="assets/branding/appicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="game"></canvas>

<div id="ui">

  <!-- ================= HUD ================= -->
  <section id="hud">
    <div id="hud-top">
      <div class="survival">
        <div class="hull-row">
          <img src="assets/ui/icon_hp.png" alt="hull" class="hud-ic">
          <div class="hull-bar"><div id="hull-fill"></div></div>
          <span id="hull-text" class="mono">100/100</span>
        </div>
        <div class="hold-row">
          <span class="hold-label">PALKA</span>
          <div id="hold-pips"></div>
          <span id="hold-text" class="mono">0/10</span>
        </div>
      </div>

      <div id="tide-block" class="tide-calm hidden">
        <div id="tide-name">TENANG</div>
        <div class="tide-bar"><div id="tide-fill"></div></div>
      </div>

      <button id="btn-mute" class="icon-btn" title="Suara (M)">♪</button>
    </div>

    <div id="goal-chip">—</div>
    <div id="hint-line" class="hidden"></div>
    <div id="bank-beat" class="hidden"></div>
    <div id="toasts"></div>

    <div id="hud-bottom">
      <div id="joystick"><div id="joy-knob"></div></div>
      <div id="hud-actions">
        <button id="btn-context" class="ctx hidden">AKSI</button>
        <button id="btn-heal" class="heal hidden">MAKAN</button>
        <button id="btn-attack" class="atk hidden">SERANG</button>
      </div>
    </div>
  </section>

  <!-- ================= MEJA PETA ================= -->
  <section id="modal-chart" class="modal hidden">
    <div class="panel modal-panel">
      <div class="modal-head">
        <h2>PETA PERAIRAN</h2>
        <button id="chart-close" class="icon-btn">✕</button>
      </div>
      <div id="chart-bank" class="chips"></div>
      <div id="chart-rows" class="chart-rows"></div>
      <p id="chart-hint" class="hint"></p>
      <button id="chart-sail" class="btn btn-primary wide">BERLAYAR</button>
      <p class="fineprint">Jarak dari dermaga adalah ongkosnya. Pulau jauh lebih kaya — dan pasang terus naik selama kau di luar.</p>
    </div>
  </section>

  <!-- ================= MEJA KERJA ================= -->
  <section id="modal-bench" class="modal hidden">
    <div class="panel modal-panel">
      <div class="modal-head">
        <h2 id="bench-title">MEJA KERJA</h2>
        <button id="bench-close" class="icon-btn">✕</button>
      </div>
      <p id="bench-sub" class="fineprint"></p>
      <div id="bench-bank" class="chips"></div>
      <div id="bench-rows" class="bench-rows"></div>
      <p class="fineprint">Gudang di dermaga tidak bisa hilang. Hanya muatan yang masih kau bawa yang bisa hilang.</p>
    </div>
  </section>

  <!-- ================= DEBRIEF ================= -->
  <section id="modal-debrief" class="modal hidden">
    <div class="panel modal-panel debrief">
      <h2 id="db-title">KAPAL TENGGELAM</h2>
      <p id="db-cause" class="cause"></p>
      <div id="db-lost"></div>
      <div id="db-kept"></div>
      <p id="db-salvage" class="salvage-line"></p>
      <div id="db-night" class="night-line"></div>
      <p id="db-goal" class="goal-line"></p>
      <button id="db-close" class="btn btn-primary wide">KEMBALI KE DERMAGA</button>
    </div>
  </section>

</div>

<noscript><div style="color:#fff;padding:20px">Game ini membutuhkan JavaScript.</div></noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
